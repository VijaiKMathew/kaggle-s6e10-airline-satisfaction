[project]
name = "kaggle-s6e10-champion-pipeline"
version = "1.0.0"
description = "Top-tier reproducible solution pipeline for Kaggle Playground Series S6E10"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Vijai KM" }
]
keywords = ["kaggle", "machine-learning", "tabular", "lightgbm", "xgboost", "catboost", "ensembling"]

dependencies = [
    "polars>=1.0.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "lightgbm>=4.3.0",
    "xgboost>=2.0.0",
    "catboost>=1.2.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "ruff>=0.5.0",
    "pytest>=8.0.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py310"
